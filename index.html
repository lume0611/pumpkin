/* ── HUD ── */
.hud{
  position:absolute;left:0;right:0;top:0;z-index:5;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:12px 14px;pointer-events:none;
}
.pill{
  background:rgba(10,14,36,.62);
  border:2px solid rgba(253,246,227,.32);
  border-radius:16px;
  padding:6px 14px;
  backdrop-filter:blur(4px);
}
.score-lbl{font-size:11px;opacity:.7;letter-spacing:.1em;line-height:1.3}
.score-val{font-size:27px;font-weight:700;line-height:1.1;color:var(--orange-lt)}
.next{display:flex;align-items:center;gap:8px}
.next span{font-size:11px;opacity:.7;letter-spacing:.1em}
.next .slot{width:42px;height:42px;display:grid;place-items:center}
.next .slot img{width:100%;height:100%;object-fit:contain}
.next .slot.hidden img{display:none}
.next .slot.hidden::after{content:"?";font-size:28px;font-weight:700;color:var(--purple)}

.badges{
  position:absolute;left:0;right:0;top:76px;z-index:5;
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  padding:0 12px;pointer-events:none;
}
.badge{
  font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;
  background:rgba(10,14,36,.72);border:2px solid;
}
.badge.t{color:var(--orange-lt);border-color:rgba(251,191,36,.6)}
.badge.k{color:var(--purple);border-color:rgba(139,92,246,.6)}

/* ── 이펙트 배너 ── */
#fx{
  position:absolute;inset:0;z-index:8;
  display:grid;place-items:center;
  pointer-events:none;opacity:0;
}
#fx.show{animation:pop 1.6s ease}
@keyframes pop{
  0%{opacity:0;transform:scale(.6)}
  16%{opacity:1;transform:scale(1.07)}
  72%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.03)}
}
#fx .wrap{text-align:center}
#fx img{width:min(44vw,180px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
#fx .word{font-size:38px;font-weight:800;letter-spacing:.06em;margin-top:-4px;
  text-shadow:0 3px 0 #000,0 0 22px rgba(0,0,0,.75)}
#fx .desc{font-size:17px;margin-top:4px;text-shadow:0 2px 0 #000}
#fx.treat .word{color:var(--orange-lt)}
#fx.trick .word{color:var(--purple)}

/* ── 오버레이 ── */
.sheet{
  position:absolute;inset:0;z-index:20;
  background:rgba(8,12,32,.86);
  display:none;place-items:center;
  padding:20px;backdrop-filter:blur(3px);
}
.sheet.on{display:grid}
.card{
  width:100%;max-width:330px;
  background:rgba(22,32,80,.95);
  border:3px solid rgba(253,246,227,.45);
  border-radius:22px;
  padding:24px 20px;text-align:center;
  max-height:100%;overflow:auto;
}
.card h1{font-size:31px;line-height:1.2;margin-bottom:10px;color:var(--orange)}
.card h2{font-size:25px;margin-bottom:8px;color:var(--orange-lt)}
.card p{font-size:15px;line-height:1.75;opacity:.9;margin-bottom:14px}
.btn{
  width:100%;padding:13px;margin-top:8px;
  font-family:inherit;font-size:17px;font-weight:700;
  border:none;border-radius:14px;cursor:pointer;
  background:var(--orange);color:#231000;
}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid rgba(253,246,227,.4)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text]{
  width:100%;padding:12px;margin-top:10px;
  font-family:inherit;font-size:17px;text-align:center;
  border-radius:12px;border:2px solid rgba(253,246,227,.35);
  background:rgba(0,0,0,.3);color:var(--cream);
}
input[type=text]:focus{outline:none;border-color:var(--orange-lt)}

.final{font-size:46px;font-weight:800;color:var(--orange-lt);line-height:1.1}
.chain{display:flex;justify-content:center;align-items:center;gap:1px;margin:12px 0 6px;flex-wrap:wrap}
.chain img{width:28px;height:28px;object-fit:contain}

.rank{margin-top:8px;text-align:left;font-size:15px}
.rank .row{display:flex;gap:8px;padding:6px;border-radius:8px}
.rank .row:nth-child(odd){background:rgba(255,255,255,.05)}
.rank .row.me{background:rgba(249,115,22,.3)}
.rank .n{width:24px;opacity:.65;text-align:right}
.rank .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .pt{color:var(--orange-lt);font-weight:700}
.msg{font-size:14px;opacity:.75;margin-top:10px;min-height:18px}
.fine{font-size:12px;opacity:.55;margin-top:12px;line-height:1.6}
</style>
</head>
<body>

<div id="board">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="pill">
      <div class="score-lbl">SCORE</div>
      <div class="score-val" id="score">0</div>
    </div>
    <div class="pill next">
      <span>NEXT</span>
      <div class="slot" id="nextSlot"><img id="nextImg" alt=""></div>
    </div>
  </div>

  <div class="badges" id="badges"></div>

  <div id="fx"><div class="wrap">
    <img id="fxImg" alt="">
    <div class="word" id="fxWord"></div>
    <div class="desc" id="fxDesc"></div>
  </div></div>

  <div class="sheet on" id="startSheet"><div class="card">
    <h1>호박 굴리기</h1>
    <p>같은 것끼리 만나면 합쳐집니다.<br>잭오랜턴까지 키워보세요.<br><br>10초에서 25초마다 <b style="color:var(--orange-lt)">TREAT</b>이나<br><b style="color:var(--purple)">TRICK</b>이 예고 없이 터집니다.</p>
    <div class="chain" id="chainPreview"></div>
    <button class="btn" id="startBtn" disabled>불러오는 중...</button>
    <button class="btn ghost" id="rankBtn">순위표 보기</button>
  </div></div>

  <div class="sheet" id="overSheet"><div class="card">
    <h2>끝!</h2>
    <div class="final" id="finalScore">0</div>
    <div id="saveArea">
      <input type="text" id="nameInput" maxlength="12" placeholder="닉네임 (12자까지)">
      <button class="btn" id="saveBtn">순위표에 올리기</button>
    </div>
    <div class="msg" id="saveMsg"></div>
    <div class="rank" id="rankList"></div>
    <button class="btn ghost" id="againBtn">다시 하기</button>
  </div></div>

  <div class="sheet" id="rankSheet"><div class="card">
    <h2>순위표</h2>
    <div class="rank" id="rankList2"></div>
    <div class="msg" id="rankMsg"></div>
    <button class="btn ghost" id="closeRank">닫기</button>
    <p class="fine">기록은 올린 뒤 수정하거나 지울 수 없습니다.</p>
  </div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdJBa0rVmNIEKDUJEH_VpVdNMDKQwGQb4",
  authDomain: "pumpkin-dcc01.firebaseapp.com",
  projectId: "pumpkin-dcc01",
  storageBucket: "pumpkin-dcc01.firebasestorage.app",
  messagingSenderId: "246688864067",
  appId: "1:246688864067:web:9a4d371b8bb00e29cc41f6"
};

const db = getFirestore(initializeApp(firebaseConfig));

window.PUMPKIN_DB = {
  async submit(name, score){
    await addDoc(collection(db, "scores"), {
      name: String(name).slice(0, 12),
      score: Math.max(0, Math.min(99999, Math.round(score))),
      at: serverTimestamp()
    });
  },
  async top(n = 15){
    const snap = await getDocs(query(collection(db, "scores"), orderBy("score", "desc"), limit(n)));
    return snap.docs.map(d => d.data());
  }
};
window.dispatchEvent(new Event("db-ready"));
</script>

const url = f => ASSET[f] || ("assets/" + f);

const IMG = {};
function load(src){
  return new Promise(res=>{
    const i = new Image();
    i.onload = ()=>res(i);
    i.onerror = ()=>res(null);
    i.src = src;
  });
}
/* assets/ 폴더에 같은 이름의 파일이 있으면 그걸 쓰고,
   없으면 이 파일에 내장된 그림을 쓴다. 누끼 다시 딴 파일을
   assets/ 안에 같은 이름으로 넣기만 하면 바로 교체된다. */
async function loadSmart(file){
  const ext = await load("assets/" + file);
  if(ext) return ext;
  return await load(url(file));
}
async function loadAll(){
  const jobs = TIERS.map(t => loadSmart(t.file));
  jobs.push(loadSmart("fx_treat_candy.png"));
  jobs.push(loadSmart("fx_trick_question.png"));
  jobs.push(loadSmart("fx_star.png"));
  const r = await Promise.all(jobs);
  TIERS.forEach((t,i)=>{ IMG[i] = r[i]; });
  IMG.treat = r[TIERS.length];
  IMG.trick = r[TIERS.length+1];
  IMG.star  = r[TIERS.length+2];
}

const { Engine, World, Bodies, Body, Events } = Matter;
let engine, world;
let bodies = [];
let particles = [];

function buildWorld(){
  engine = Engine.create();
  engine.gravity.y = 1.15;
  engine.positionIterations = 8;
  engine.velocityIterations = 8;
  world = engine.world;

  const opt = { isStatic:true, friction:.4, restitution:.05 };
  World.add(world, [
    Bodies.rectangle(W/2, FLOOR + WALL/2, W*2, WALL, opt),
    Bodies.rectangle(-WALL/2, H/2, WALL, H*3, opt),
    Bodies.rectangle(W + WALL/2, H/2, WALL, H*3, opt)
  ]);

  Events.on(engine, "collisionStart", e=>{
    for(const p of e.pairs){
      const a = p.bodyA, b = p.bodyB;
      if(a.tierIdx === undefined || b.tierIdx === undefined) continue;
      if(a.merged || b.merged) continue;
      if(a.tierIdx !== b.tierIdx && !a.wild && !b.wild) continue;
      merge(a, b);
    }
  });
}

function spawn(tier, x, y, wild){
  const t = TIERS[tier];
  const body = Bodies.circle(x, y, t.r, {
    restitution:.16, friction:.32, frictionStatic:.6,
    density:.0016, slop:.02
  });
  body.tierIdx = tier;
  body.wild = !!wild;
  body.born = performance.now();
  body.spin = (Math.random()-.5) * .04;
  Body.setAngle(body, (Math.random()-.5) * .5);
  World.add(world, body);
  bodies.push(body);
  return body;
}

function removeBody(b){
  World.remove(world, b);
  const i = bodies.indexOf(b);
  if(i >= 0) bodies.splice(i,1);
}

function merge(a, b){
  a.merged = b.merged = true;
  const x = (a.position.x + b.position.x)/2;
  const y = (a.position.y + b.position.y)/2;
  const tier = Math.max(a.tierIdx, b.tierIdx);
  removeBody(a); removeBody(b);
  burst(x, y);

  const next = tier + 1;
  if(next < TIERS.length){
    const nb = spawn(next, x, y);
    Body.setVelocity(nb, {x:0, y:-1.4});
    addScore(TIERS[next].pts);
  }else{
    addScore(120);   // 잭오랜턴끼리 만나면 사라지고 보너스
  }
}

function burst(x, y){
  for(let i=0;i<7;i++){
    particles.push({
      x, y,
      vx:(Math.random()-.5)*5.5,
      vy:-Math.random()*5-1,
      life:1, size:12+Math.random()*16,
      rot:Math.random()*6.28
    });
  }
}

/* ══════════════ 상태 ══════════════ */
let score = 0, playing = false, over = false;
let held = null, nextTier = 0;
let aimX = W/2, lastDrop = 0, dangerTimer = 0, shakeAmt = 0;
const TIMED = ["mult","blind","aimOff","fog","mirror","heavy"];
const modes = { mult:0, multV:1, upgrade:0, wild:0, blind:0, aimOff:0, drift:0, fog:0, mirror:0, heavy:0 };
let nextEventAt = 0;

const $ = id => document.getElementById(id);

function aimPos(){ return modes.mirror > 0 ? (W - aimX) : aimX; }

function addScore(n){
  score += (modes.mult > 0) ? n*modes.multV : n;
  $("score").textContent = score;
}
function pickTier(){
  return SPAWNABLE[Math.floor(Math.random()*SPAWNABLE.length)];
}
function refillHeld(){
  let t = nextTier, wild = false;
  if(modes.upgrade > 0){ t = Math.min(t+2, 4); modes.upgrade--; }
  if(modes.wild > 0){ wild = true; modes.wild--; }
  held = { tier:t, wild };
  nextTier = pickTier();
  paintNext();
  paintBadges();
}

let badgeSig = "";
function paintBadges(){
  const out = [];
  if(modes.wild > 0)    out.push(["t","만능 " + modes.wild]);
  if(modes.upgrade > 0) out.push(["t","큰 거 " + modes.upgrade]);
  if(modes.mult > 0)    out.push(["t","점수 x" + modes.multV]);
  if(modes.drift > 0)   out.push(["k","미끄럼 " + modes.drift]);
  if(modes.mirror > 0)  out.push(["k","좌우 반대"]);
  if(modes.fog > 0)     out.push(["k","안개"]);
  if(modes.heavy > 0)   out.push(["k","무거움"]);
  if(modes.blind > 0)   out.push(["k","깜깜"]);
  const sig = out.map(o => o.join()).join("|");
  if(sig === badgeSig) return;
  badgeSig = sig;
  $("badges").innerHTML = out.map(o => `<div class="badge ${o[0]}">${o[1]}</div>`).join("");
}
function paintNext(){
  const slot = $("nextSlot");
  if(modes.blind > 0){ slot.classList.add("hidden"); return; }
  slot.classList.remove("hidden");
  $("nextImg").src = IMG[nextTier] ? IMG[nextTier].src : url(TIERS[nextTier].file);
}
function drop(){
  if(!playing || over || !held) return;
  const now = performance.now();
  if(now - lastDrop < COOLDOWN) return;
  lastDrop = now;

  let x = aimPos();
  if(modes.drift > 0){ x += (Math.random()-.5) * 150; modes.drift--; }
  const r = TIERS[held.tier].r;
  x = Math.max(r+2, Math.min(W-r-2, x));

  const b = spawn(held.tier, x, DROP_Y, held.wild);
  Body.setVelocity(b, {x:0, y:2});
  held = null;
  setTimeout(refillHeld, 120);
}

/* ══════════════ TRICK / TREAT ══════════════ */
const TREATS = [
  { desc:"만능 사탕 두 개! 아무거나 합쳐집니다", run(){ modes.wild = 2; } },
  { desc:"10초 동안 점수 세 배",                run(){ modes.mult = 10000; modes.multV = 3; } },
  { desc:"작은 것들이 한꺼번에 자랍니다",        run(){ growAllSmallest(); } },
  { desc:"다음 세 개가 크게 나옵니다",           run(){ modes.upgrade = 3; } }
];
const TRICKS = [
  { desc:"지진!",                        run(){ quake(); } },
  { desc:"유령이 들어올립니다",           run(){ ghostLift(); } },
  { desc:"7초 동안 아래가 안 보입니다",    run(){ modes.fog = 7000; } },
  { desc:"6초 동안 좌우가 반대!",          run(){ modes.mirror = 6000; } },
  { desc:"5초 동안 몸이 무겁습니다",       run(){ modes.heavy = 5000; } },
  { desc:"손이 다섯 번 미끄러집니다",      run(){ modes.drift = 5; } },
  { desc:"다음 게 안 보입니다",           run(){ modes.blind = 8000; paintNext(); } }
];

function growAllSmallest(){
  let min = 99;
  for(const b of bodies) if(b.tierIdx < min) min = b.tierIdx;
  if(min > TIERS.length - 2) return;
  const targets = bodies.filter(b => b.tierIdx === min).slice(0, 8);
  for(const t of targets){
    const {x, y} = t.position;
    removeBody(t); burst(x, y);
    spawn(min + 1, x, y);
    addScore(TIERS[min + 1].pts);
  }
}

function quake(){
  shakeAmt = 30;
  for(const b of bodies){
    Body.setVelocity(b, {
      x: b.velocity.x + (Math.random() - .5) * 11,
      y: b.velocity.y - Math.random() * 4.5
    });
    Body.setAngularVelocity(b, (Math.random() - .5) * .4);
  }
}

function ghostLift(){
  const pool = bodies.slice().sort(() => Math.random() - .5).slice(0, 3);
  for(const b of pool){
    Body.setVelocity(b, { x:(Math.random() - .5) * 7, y:-13 });
    Body.setAngularVelocity(b, (Math.random() - .5) * .5);
    burst(b.position.x, b.position.y);
  }
}

function fireEvent(){
  const treat = Math.random() < .5;
  const pool = treat ? TREATS : TRICKS;
  const ev = pool[Math.floor(Math.random() * pool.length)];
  ev.run();
  paintBadges();

  const fx = $("fx");
  $("fxImg").src = (treat ? IMG.treat : IMG.trick)?.src || url(treat ? "fx_treat_candy.png" : "fx_trick_question.png");
  $("fxWord").textContent = treat ? "TREAT!" : "TRICK!";
  $("fxDesc").textContent = ev.desc;
  fx.className = treat ? "treat" : "trick";
  void fx.offsetWidth;
  fx.classList.add("show");
  scheduleEvent();
}
function scheduleEvent(first){
  nextEventAt = performance.now() + (first ? 9000 : 12000 + Math.random() * 13000);
}

/* ══════════════ 렌더 ══════════════ */
const cv = $("cv"), ctx = cv.getContext("2d");
let scale = 1;

function resize(){
  const rect = $("board").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width  = Math.round(rect.width  * dpr);
  cv.height = Math.round(rect.height * dpr);
  scale = (rect.width / W) * dpr;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize, 250));

function sprite(tier, x, y, angle, wild){
  const img = IMG[tier];
  const d = TIERS[tier].r * ART_SCALE[tier];
  const off = ART_OFF[tier] || [0,0];
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.translate(off[0], off[1]);
  if(wild){
    ctx.shadowColor = "rgba(255,235,130,1)";
    ctx.shadowBlur = 34;
  }else if(tier === TIERS.length-1){
    ctx.shadowColor = "rgba(255,170,40,.95)";
    ctx.shadowBlur = 26;
  }
  if(img) ctx.drawImage(img, -d/2, -d/2, d, d);
  else { ctx.fillStyle = "#f97316"; ctx.beginPath(); ctx.arc(0,0,d/2,0,6.28); ctx.fill(); }
  ctx.restore();
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  const sx = (Math.random()-.5)*shakeAmt*scale;
  const sy = (Math.random()-.5)*shakeAmt*scale;
  ctx.setTransform(scale,0,0,scale, sx, sy);

  if(playing && !over){
    ctx.save();
    ctx.strokeStyle = "rgba(249,115,22,.5)";
    ctx.lineWidth = 2; ctx.setLineDash([9,9]);
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y); ctx.lineTo(W, DANGER_Y); ctx.stroke();
    ctx.restore();
  }

  if(playing && !over && held){
    const r = TIERS[held.tier].r;
    const x = Math.max(r+2, Math.min(W-r-2, aimPos()));
    if(modes.aimOff <= 0){
      ctx.save();
      ctx.strokeStyle = "rgba(253,246,227,.35)";
      ctx.lineWidth = 2; ctx.setLineDash([6,10]);
      ctx.beginPath(); ctx.moveTo(x, DROP_Y + r); ctx.lineTo(x, FLOOR); ctx.stroke();
      ctx.restore();
    }
    sprite(held.tier, x, DROP_Y, 0, held.wild);
  }

  for(const b of bodies) sprite(b.tierIdx, b.position.x, b.position.y, b.angle, b.wild);

  if(modes.fog > 0){
    const g = ctx.createLinearGradient(0, H*.40, 0, H*.62);
    g.addColorStop(0, "rgba(10,14,36,0)");
    g.addColorStop(1, "rgba(10,14,36,.97)");
    ctx.fillStyle = g;
    ctx.fillRect(0, H*.40, W, H);
  }

  for(const p of particles){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if(IMG.star) ctx.drawImage(IMG.star, -p.size/2, -p.size/2, p.size, p.size);
    ctx.restore();
  }
}

/* ══════════════ 루프 ══════════════ */
let last = performance.now();
function tick(now){
  const dt = Math.min(now - last, 42);
  last = now;

  if(playing && !over){
    Engine.update(engine, dt);

    for(const k of TIMED){
      if(modes[k] > 0){
        modes[k] -= dt;
        if(modes[k] <= 0){
          modes[k] = 0;
          if(k === "blind") paintNext();
          if(k === "mult") modes.multV = 1;
        }
      }
    }
    engine.gravity.y = modes.heavy > 0 ? 2.4 : 1.15;
    paintBadges();
    if(now > nextEventAt) fireEvent();

    for(const b of bodies){
      if(Math.abs(b.angularVelocity) < .002) Body.setAngularVelocity(b, b.spin);
    }

    let danger = false;
    for(const b of bodies){
      if(now - b.born < 1200) continue;
      if(Math.hypot(b.velocity.x, b.velocity.y) > .55) continue;
      if(b.position.y - b.circleRadius < DANGER_Y){ danger = true; break; }
    }
    dangerTimer = danger ? dangerTimer + dt : 0;
    if(dangerTimer > 1700) gameOver();
  }

  if(shakeAmt > 0) shakeAmt = Math.max(0, shakeAmt - dt*.045);

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .34;
    p.rot += .13; p.life -= .028;
    if(p.life <= 0) particles.splice(i,1);
  }

  draw();
  requestAnimationFrame(tick);
}

/* ══════════════ 입력 ══════════════ */
const board = $("board");
function toBoardX(clientX){
  const r = board.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
board.addEventListener("pointermove", e=>{
  if(e.target.closest(".sheet")) return;
  aimX = toBoardX(e.clientX);
});
board.addEventListener("pointerdown", e=>{
  if(e.target.closest(".sheet")) return;
  aimX = toBoardX(e.clientX);
});
board.addEventListener("pointerup", e=>{
  if(e.target.closest(".sheet")) return;
  aimX = toBoardX(e.clientX);
  drop();
});

/* ══════════════ 흐름 ══════════════ */
function startGame(){
  if(!engine) return;                 // 준비 전에는 무시
  bodies.forEach(b => World.remove(world, b));
  bodies = []; particles = [];
  score = 0; over = false; dangerTimer = 0; shakeAmt = 0;
  for(const k in modes) modes[k] = 0;
  modes.multV = 1;
  engine.gravity.y = 1.15;
  badgeSig = "x"; 
  nextTier = pickTier();
  $("score").textContent = "0";
  refillHeld();
  scheduleEvent(true);
  $("startSheet").classList.remove("on");
  $("overSheet").classList.remove("on");
  playing = true;
}

function gameOver(){
  over = true; playing = false;
  $("finalScore").textContent = score;
  $("saveArea").style.display = "";
  $("saveBtn").disabled = false;
  $("saveMsg").textContent = "";
  $("rankList").innerHTML = "";
  $("overSheet").classList.add("on");
}

/* ══════════════ 순위표 ══════════════ */
let dbReady = false;
window.addEventListener("db-ready", ()=>{ dbReady = true; });

function renderRank(el, rows, mine){
  if(!rows.length){
    el.innerHTML = '<div class="row"><div class="who">아직 아무도 없습니다</div></div>';
    return;
  }
  el.innerHTML = rows.map((r,i)=>{
    const me = (mine && r.name === mine.name && r.score === mine.score) ? " me" : "";
    const nm = String(r.name||"?").replace(/[<>&]/g, "");
    return `<div class="row${me}"><div class="n">${i+1}</div><div class="who">${nm}</div><div class="pt">${r.score}</div></div>`;
  }).join("");
}

async function showRank(listEl, msgEl, mine){
  msgEl.textContent = "불러오는 중...";
  if(!dbReady){ msgEl.textContent = "연결 준비 중입니다. 잠시 뒤 다시 눌러주세요."; return; }
  try{
    renderRank(listEl, await window.PUMPKIN_DB.top(15), mine);
    msgEl.textContent = "";
  }catch(err){
    msgEl.textContent = "순위표를 불러오지 못했습니다.";
    console.error(err);
  }
}

$("saveBtn").addEventListener("click", async ()=>{
  const name = $("nameInput").value.trim().replace(/\s+/g," ");
  if(!name){ $("saveMsg").textContent = "닉네임을 적어주세요."; return; }
  if(!dbReady){ $("saveMsg").textContent = "연결 준비 중입니다."; return; }
  $("saveBtn").disabled = true;
  $("saveMsg").textContent = "올리는 중...";
  try{
    await window.PUMPKIN_DB.submit(name, score);
    $("saveArea").style.display = "none";
    $("saveMsg").textContent = "올렸습니다!";
    await showRank($("rankList"), $("saveMsg"), {name, score});
  }catch(err){
    $("saveBtn").disabled = false;
    $("saveMsg").textContent = "실패했습니다. 다시 눌러주세요.";
    console.error(err);
  }
});

$("startBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);
$("rankBtn").addEventListener("click", ()=>{
  $("rankSheet").classList.add("on");
  showRank($("rankList2"), $("rankMsg"), null);
});
$("closeRank").addEventListener("click", ()=> $("rankSheet").classList.remove("on"));

/* ══════════════ 시작 ══════════════ */
(async function(){
  try{
  await loadAll();
  $("chainPreview").innerHTML = TIERS.map((t,i) => `<img src="${IMG[i] ? IMG[i].src : url(t.file)}" alt="">`).join("");
  resize();
  buildWorld();
  requestAnimationFrame(tick);
  const sb = $("startBtn");
  sb.disabled = false;
  sb.textContent = "시작하기";
  }catch(err){
    console.error(err);
    document.getElementById("startSheet").innerHTML =
      '<div class="card"><h2>시작할 수 없습니다</h2><p>' +
      String(err.message || err) + '</p></div>';
  }
})();

})();
</script>
